name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
  pull_request:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.x"
        os:
          - ubuntu-latest
        arch:
          - x64

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@latest

      - uses: julia-actions/cache@v2

      # FuseRegistry from the TimSlendebroek fork: its packages point at the public forks over HTTPS, so no
      # token is needed. ProjectTorreyPines is made unreachable, so CI fails if anything still depends on it.
      - name: Add FuseRegistry (fork) and block ProjectTorreyPines
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://ptp-blocked.invalid/".insteadOf "https://github.com/ProjectTorreyPines/"
          git config --global --add url."https://ptp-blocked.invalid/".insteadOf "git@github.com:ProjectTorreyPines/"
          rm -rf ~/.julia/registries/FuseRegistry
          julia -e 'using Pkg; Pkg.Registry.add(RegistrySpec(url="https://github.com/TimSlendebroek/FuseRegistry.jl.git")); Pkg.Registry.add("General"); Pkg.Registry.update()'

      - name: Install dependencies
        run: |
          julia -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
          '

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
